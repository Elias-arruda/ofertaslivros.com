<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>A, histórico, feed</title><link rel="stylesheet" href="anuncio.css"></head>
<body>
<main class="peca feed" style="--b1:#ff8a8f;--b2:#2b8fd6">
  <img class="logo" src="logo-negativo.svg" alt="ofertaslivros.com">
  <h1>Baixou de verdade?</h1>
  <p class="sub">A gente guarda o histórico de preço dos livros. Você vê se o desconto é real.</p>
  <figure class="hc">
    <span class="stamp">Menor preço do histórico</span>
      <svg viewBox="0 0 800 400" role="img" aria-label="Linha do preço de um livro ao longo do tempo, com sobe e desce, terminando hoje no ponto mais baixo, sobre a linha tracejada do menor preço.">
        <line x1="0" y1="80" x2="330" y2="80" stroke="#e6ebf31a" stroke-width="3"/>
        <line x1="0" y1="300" x2="770" y2="300" stroke="#ff8a8f" stroke-width="4" stroke-dasharray="12 12"/>
        <path d="M0 170 H90 V115 H220 V80 H310 V150 H420 V120 H530 V215 H620 V300 H770" fill="none" stroke="#e6ebf3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="770" cy="300" r="17" fill="#ff8a8f" stroke="#18233b" stroke-width="6"/>
        <text class="lbl" x="0" y="372">há 30 dias</text>
        <text class="lbl" x="770" y="372" text-anchor="end">hoje</text>
      </svg>
  </figure>
</main>
</body>
</html>
