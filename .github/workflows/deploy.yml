name: deploy

on:
  push:
    branches: [main]
  # O pipeline grava price-history com GITHUB_TOKEN; push não inicia outro workflow.
  # Esta conclusão faz o deploy depois da coleta sem usar PAT.
  workflow_run:
    workflows: [pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      retencao_dias:
        description: "Apagar pedidos do Netlify mais velhos que N dias (0 só para testar a limpeza)"
        default: "30"

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Só a main publica; os secrets do Cloudflare e do Netlify ficam no Environment production (restrito à main).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ML_AFFILIATE_ID: ${{ vars.ML_AFFILIATE_ID }}
      AMAZON_PARTNER_TAG: ${{ vars.AMAZON_PARTNER_TAG }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      WHATSAPP_CHANNEL_ID: ${{ vars.WHATSAPP_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Abrir os dados validados do coletor
        run: |
          git fetch --no-tags --depth=1 origin \
            refs/heads/price-history:refs/remotes/origin/price-history
          git show origin/price-history:offers.json > data/offers.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          doc = json.loads(Path("data/offers.json").read_text(encoding="utf-8"))
          offers = doc.get("offers")
          if doc.get("version") != 2 or doc.get("_exemplo") is True:
              raise SystemExit("offers.json não contém dados reais no contrato v2")
          if not isinstance(offers, list) or not offers:
              raise SystemExit("offers.json não contém ofertas; deploy cancelado")
          if "amazon" in {store.get("store") for offer in offers
                           for store in offer.get("stores", [])} \
                  and not os.environ.get("AMAZON_PARTNER_TAG"):
              raise SystemExit("AMAZON_PARTNER_TAG precisa estar em Actions Variables")
          PY

      - name: Validar e gerar o site
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python build.py --selftest
          pytest
          python build.py

      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy

      # Agendador da coleta (Cron Trigger): só dispara o workflow pipeline; sem rota pública.
      - name: Publicar o agendador da coleta
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy --config cron/wrangler.jsonc

      # ofertaslivros.com fica no Netlify: a Vivo bloqueia os IPs da zona no Cloudflare (2026-10-20).
      # Por último: se o Netlify falhar, o site no Cloudflare e o agendador já saíram.
      # Mesmo dist/ (_headers e _redirects valem igual). Zip na API do Netlify: sem CLI de terceiros.
      # Cada deploy no Netlify custa 15 créditos (plano Personal: 1.000/mês). Push e dispatch publicam sempre.
      # A coleta (workflow_run) só publica se o conteúdo mudou e se o mês ainda está dentro da cota
      # acumulada (dia do mês × DEPLOYS_POR_DIA, contando todos os deploys, inclusive os de merge).
      - name: Decidir se publica no Netlify
        id: netlify_gate
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          EVENTO: ${{ github.event_name }}
          DEPLOYS_POR_DIA: "2" # 62 × 15 = 930 créditos no mês de 31 dias; o resto fica para tráfego
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timezone

          doc = json.loads(open("data/offers.json", encoding="utf-8").read())
          for offer in doc["offers"]:
              for store in offer["stores"]:
                  store.pop("checked_at", None)  # muda a cada coleta; preço igual não republica
          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout
          sig = hashlib.sha256((json.dumps(doc, sort_keys=True) + head).encode()).hexdigest()[:16]

          def deploys():  # mais novo primeiro; para no primeiro deploy de mês anterior
              page = 1
              while True:
                  req = urllib.request.Request(
                      f"https://api.netlify.com/api/v1/sites/{os.environ['NETLIFY_SITE_ID']}/deploys"
                      f"?per_page=100&page={page}",
                      headers={"Authorization": "Bearer " + os.environ["NETLIFY_AUTH_TOKEN"]})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      lote = json.load(r)
                  if not lote:
                      return
                  yield from lote
                  page += 1

          if os.environ["EVENTO"] != "workflow_run":
              # sem consultar a API: falha do Netlify aqui não pode barrar merge nem dispatch
              publicar, motivo = True, "push ou dispatch publica sempre"
          else:
              now = datetime.now(timezone.utc)
              mes = now.strftime("%Y-%m")
              ultimo, no_mes = None, 0
              for d in deploys():
                  if ultimo is None and d["state"] == "ready":
                      ultimo = d
                  if not d["created_at"].startswith(mes):
                      break
                  no_mes += 1  # todo estado conta: erro também pode ter gasto crédito
              cota = now.day * int(os.environ["DEPLOYS_POR_DIA"])
              if ultimo and ultimo.get("title") == f"sig-{sig}":
                  publicar, motivo = False, "conteúdo igual ao último deploy"
              elif no_mes >= cota:
                  publicar, motivo = False, f"cota do mês: {no_mes} deploys, limite até hoje {cota}"
              else:
                  publicar, motivo = True, f"conteúdo novo ({no_mes + 1}/{cota} no mês)"
          print(f"netlify: {'publica' if publicar else 'pula'}: {motivo}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"publicar={str(publicar).lower()}\nsig={sig}\n")
          PY

      - name: Publicar no Netlify (ofertaslivros.com)
        if: steps.netlify_gate.outputs.publicar == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          SIG: ${{ steps.netlify_gate.outputs.sig }}
        run: |
          : "${NETLIFY_AUTH_TOKEN:?segredo NETLIFY_AUTH_TOKEN ausente}" "${NETLIFY_SITE_ID:?variável NETLIFY_SITE_ID ausente}"
          (cd dist && zip -qr "$RUNNER_TEMP/site.zip" .)
          curl -sS --fail-with-body -o "$RUNNER_TEMP/netlify.json" -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/zip" \
            --data-binary @"$RUNNER_TEMP/site.zip" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?title=sig-$SIG" \
            || { cat "$RUNNER_TEMP/netlify.json"; exit 1; } # erro da API (sem o token)
          # O POST só cria o deploy; espera o Netlify processar (até ~3 min) para o job refletir o resultado.
          id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/netlify.json")
          for _ in $(seq 36); do
            state=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')
            echo "netlify: $state"
            case "$state" in ready) exit 0 ;; error|rejected) exit 1 ;; esac
            sleep 5
          done
          echo "netlify: deploy não ficou pronto a tempo"; exit 1

      # Pedidos do form (Netlify Forms) guardam IP e navegador: a privacidade promete apagar em 30 dias.
      # Roda mesmo se o deploy falhar, para a retenção não depender do site publicar.
      - name: Apagar pedidos do Netlify com mais de 30 dias
        if: ${{ !cancelled() }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          RETENCAO_DIAS: ${{ inputs.retencao_dias || '30' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          api = "https://api.netlify.com/api/v1"
          auth = {"Authorization": "Bearer " + os.environ["NETLIFY_AUTH_TOKEN"]}
          limite = datetime.now(timezone.utc) - timedelta(days=int(os.environ["RETENCAO_DIAS"]))

          def call(method, path):
              req = urllib.request.Request(api + path, method=method, headers=auth)
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
              return json.loads(body) if body else None

          apagados = 0
          for form in call("GET", f"/sites/{os.environ['NETLIFY_SITE_ID']}/forms"):
              for estado in ("", "&state=spam"):  # spam também guarda IP
                  velhos, page = [], 1
                  while lote := call("GET", f"/forms/{form['id']}/submissions?per_page=100&page={page}{estado}"):
                      velhos += [s["id"] for s in lote
                                 if datetime.fromisoformat(s["created_at"].replace("Z", "+00:00")) < limite]
                      page += 1
                  for sid in velhos:  # apaga depois de listar, para não pular página
                      call("DELETE", f"/submissions/{sid}")
                      apagados += 1
          print(f"netlify: {apagados} pedido(s) apagado(s), limite {limite:%Y-%m-%d %H:%M} UTC")
          PY
